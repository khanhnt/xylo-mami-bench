base_configs:
  - p1_align_v2.yaml

experiment_name: p1_align_ablation_shuffled_exact_control
output_dir: outputs/p1_align_ablation_shuffled_exact_control

stages:
  - name: warmup_macro_prioritized
    epochs: 2
    lambda_macro_ce: 1.0
    lambda_micro_ce: 0.5
    lambda_supcon: 0.0
    lambda_tax: 0.0
    relation_policy: exact_only
    freeze_macro_encoder_epochs: 2
    freeze_macro_classifier_epochs: 2
  - name: shuffled_alignment_main
    epochs: 8
    lambda_macro_ce: 1.0
    lambda_micro_ce: 0.5
    lambda_supcon: 0.005
    lambda_tax: 0.0
    relation_policy: shuffled_exact_control
    freeze_macro_encoder_epochs: 1
    freeze_macro_classifier_epochs: 0
  - name: shuffled_alignment_refine
    epochs: 3
    lambda_macro_ce: 1.0
    lambda_micro_ce: 0.5
    lambda_supcon: 0.005
    lambda_tax: 0.0
    relation_policy: shuffled_exact_control
    freeze_macro_encoder_epochs: 0
    freeze_macro_classifier_epochs: 0
