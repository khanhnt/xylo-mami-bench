base_configs:
  - ../train/baseline.yaml

experiment_name: p1_baseline_micro
output_dir: outputs/p1_baseline_micro

dataset:
  mode: micro_classification
  train_split_csv: data/processed/splits/p1_train.csv
  val_split_csv: data/processed/splits/p1_val.csv
  test_split_csv: data/processed/splits/p1_test.csv
  image_size: 384
  batch_size: 16
  eval_batch_size: 32

model:
  backbone_name: convnext_small
  num_classes: 33

evaluation:
  split_name: test
